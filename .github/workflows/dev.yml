name: Deploy to Dev

on:
  push:
    branches:
      - dev

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21

      - name: Run Unit Tests
        run: go test ./...

      - name: Calculate Code Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | grep total | awk '{print $3}' | cut -d '%' -f 1 > coverage.txt
        id: coverage

      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(cat coverage.txt)
          if (( $(echo "$COVERAGE < 80.0" | bc -l) )); then
            echo "Coverage below 80%"
            exit 1
          fi

      - name: Run SonarQube Scan
        uses: sonarsource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.projectKey=sample-web-app
            -Dsonar.organization=your-org
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: <aws_account_id>.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_NAME: sample-web-app
        run: |
          docker build -t $ECR_REGISTRY/$IMAGE_NAME:dev .
          docker push $ECR_REGISTRY/$IMAGE_NAME:dev

  deploy:
    needs: build-test-scan
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name dev-cluster --region us-east-1

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/dev-deployment.yaml
